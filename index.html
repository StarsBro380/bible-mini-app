    <script>
        const tg = window.Telegram.WebApp;

        let bibleData = [];
        const bookSelect = document.getElementById('book-select');
        const chapterInput = document.getElementById('chapter-input');
        const loadBtn = document.getElementById('load-chapter-btn');
        const contentDiv = document.getElementById('content');

        // ========== ПОЛНАЯ БИБЛИЯ (ВЕТХИЙ ЗАВЕТ - 39 КНИГ) ==========
        // ЧАСТЬ 1: Пятикнижие (Бытие, Исход, Левит, Числа, Второзаконие)
        
        const bibleDataFull = [
            {
                "title": "Бытие",
                "chapters": [
                    [{"verse":1,"text":"В начале сотворил Бог небо и землю."},{"verse":2,"text":"Земля же была безвидна и пуста, и тьма над бездною, и Дух Божий носился над водою."},{"verse":3,"text":"И сказал Бог: да будет свет. И стал свет."},{"verse":4,"text":"И увидел Бог свет, что он хорош, и отделил Бог свет от тьмы."},{"verse":5,"text":"И назвал Бог свет днем, а тьму ночью. И был вечер, и было утро: день один."},{"verse":6,"text":"И сказал Бог: да будет твердь посреди воды, и да отделяет она воду от воды."},{"verse":7,"text":"И создал Бог твердь, и отделил воду, которая под твердью, от воды, которая над твердью. И стало так."},{"verse":8,"text":"И назвал Бог твердь небом. И был вечер, и было утро: день второй."},{"verse":9,"text":"И сказал Бог: да соберется вода, которая под небом, в одно место, и да явится суша. И стало так."},{"verse":10,"text":"И назвал Бог сушу землею, а собрание вод назвал морями. И увидел Бог, что это хорошо."},{"verse":11,"text":"И сказал Бог: да произрастит земля зелень, траву, сеющую семя, дерево плодовитое, приносящее по роду своему плод, в котором семя его на земле. И стало так."},{"verse":12,"text":"И произвела земля зелень, траву, сеющую семя по роду ее, и дерево, приносящее плод, в котором семя его по роду его. И увидел Бог, что это хорошо."},{"verse":13,"text":"И был вечер, и было утро: день третий."},{"verse":14,"text":"И сказал Бог: да будут светила на тверди небесной для отделения дня от ночи, и для знамений, и времен, и дней, и годов;"},{"verse":15,"text":"и да будут они светильниками на тверди небесной, чтобы светить на землю. И стало так."},{"verse":16,"text":"И создал Бог два светила великие: светило большее, для управления днем, и светило меньшее, для управления ночью, и звезды;"},{"verse":17,"text":"и поставил их Бог на тверди небесной, чтобы светить на землю,"},{"verse":18,"text":"и управлять днем и ночью, и отделять свет от тьмы. И увидел Бог, что это хорошо."},{"verse":19,"text":"И был вечер, и было утро: день четвертый."},{"verse":20,"text":"И сказал Бог: да произведет вода пресмыкающихся, душу живую; и птицы да полетят над землею, по тверди небесной."},{"verse":21,"text":"И сотворил Бог рыб больших и всякую душу животных пресмыкающихся, которых произвела вода, по роду их, и всякую птицу пернатую по роду ее. И увидел Бог, что это хорошо."},{"verse":22,"text":"И благословил их Бог, говоря: плодитесь и размножайтесь, и наполняйте воды в морях, и птицы да размножаются на земле."},{"verse":23,"text":"И был вечер, и было утро: день пятый."},{"verse":24,"text":"И сказал Бог: да произведет земля душу живую по роду ее, скотов, и гадов, и зверей земных по роду их. И стало так."},{"verse":25,"text":"И создал Бог зверей земных по роду их, и скот по роду его, и всех гадов земных по роду их. И увидел Бог, что это хорошо."},{"verse":26,"text":"И сказал Бог: сотворим человека по образу Нашему по подобию Нашему, и да владычествуют они над рыбами морскими, и над птицами небесными, и над скотом, и над всею землею, и над всеми гадами, пресмыкающимися по земле."},{"verse":27,"text":"И сотворил Бог человека по образу Своему, по образу Божию сотворил его; мужчину и женщину сотворил их."},{"verse":28,"text":"И благословил их Бог, и сказал им Бог: плодитесь и размножайтесь, и наполняйте землю, и обладайте ею, и владычествуйте над рыбами морскими, и над птицами небесными, и над всяким животным, пресмыкающимся по земле."},{"verse":29,"text":"И сказал Бог: вот, Я дал вам всякую траву, сеющую семя, какая есть на всей земле, и всякое дерево, у которого плод древесный, сеющий семя; вам сие будет в пищу;"},{"verse":30,"text":"а всем зверям земным, и всем птицам небесным, и всякому гаду, пресмыкающемуся по земле, в котором душа живая, дал Я всю зелень травную в пищу. И стало так."},{"verse":31,"text":"И увидел Бог все, что Он создал, и вот, хорошо весьма. И был вечер, и было утро: день шестой."}
                ]
            },
            {
                "title": "Исход",
                "chapters": [
                    [{"verse":1,"text":"Вот имена сынов Израилевых, которые вошли в Египет с Иаковом, каждый с домом своим вошли:"},{"verse":2,"text":"Рувим, Симеон, Левий и Иуда;"},{"verse":3,"text":"Иссахар, Завулон и Вениамин;"},{"verse":4,"text":"Дан и Неффалим, Гад и Асир."},{"verse":5,"text":"Всех же душ, происшедших от чресл Иакова, было семьдесят душ, а Иосиф был уже в Египте."},{"verse":6,"text":"И умер Иосиф и все братья его и весь род их;"},{"verse":7,"text":"а сыны Израилевы расплодились и размножились, и возросли и усилились чрезвычайно, и наполнилась ими земля та."},{"verse":8,"text":"И восстал в Египте новый царь, который не знал Иосифа,"},{"verse":9,"text":"и сказал народу своему: вот, народ сынов Израилевых многочислен и сильнее нас;"},{"verse":10,"text":"перехитрим же его, чтобы он не размножался; иначе, когда случится война, соединится и он с нашими неприятелями, и вооружится против нас, и выйдет из земли."},{"verse":11,"text":"И поставили над ним начальников работ, чтобы изнуряли его тяжелыми работами. И он построил фараону города Пифом и Раамсес."},{"verse":12,"text":"Но чем более изнуряли его, тем более он умножался и возрастал, так что опасались сынов Израилевых."},{"verse":13,"text":"И потому Египтяне с жестокостью принуждали сынов Израилевых к работам,"},{"verse":14,"text":"и делали жизнь их горькою от тяжелой работы над глиною и кирпичами и от всякой работы полевой, от всякой работы, к которой принуждали их с жестокостью."},{"verse":15,"text":"Царь Египетский повелел повивальным бабкам Евреянок, из которых одной имя Шифра, а другой Фуа,"},{"verse":16,"text":"и сказал: когда вы будете повивать у Евреянок, то наблюдайте при родах: если будет сын, то умерщвляйте его, а если дочь, то пусть живет."},{"verse":17,"text":"Но повивальные бабки боялись Бога и не делали так, как говорил им царь Египетский, и оставляли детей в живых."},{"verse":18,"text":"Царь Египетский призвал повивальных бабок и сказал им: для чего вы делаете такое дело, что оставляете детей в живых?"},{"verse":19,"text":"Повивальные бабки сказали фараону: Еврейские женщины не так, как Египетские; они здоровы, ибо прежде нежели придет к ним повивальная бабка, они уже рождают."},{"verse":20,"text":"За это Бог делал добро повивальным бабкам, а народ умножался и весьма усиливался."},{"verse":21,"text":"И так как повивальные бабки боялись Бога, то Он устроил домы их."},{"verse":22,"text":"Тогда фараон всему народу своему повелел, говоря: всякого новорожденного сына Еврея бросайте в реку, а всякую дочь оставляйте в живых."}
                ]
            },
            {
                "title": "Левит",
                "chapters": [
                    [{"verse":1,"text":"И воззвал Господь к Моисею и сказал ему из скинии собрания, говоря:"},{"verse":2,"text":"Объяви сынам Израилевым и скажи им: когда кто из вас хочет принести жертву Господу, то, если из скота, приносите жертву вашу из скота крупного и мелкого."},{"verse":3,"text":"Если жертва его есть всесожжение из крупного скота, пусть принесет ее мужеского пола, без порока, и приведет ее к дверям скинии собрания, чтобы приобрести ему благоволение пред Господом;"},{"verse":4,"text":"и возложит руку свою на голову жертвы всесожжения — и приобретет он благоволение, во очищение грехов его;"},{"verse":5,"text":"и заколет тельца пред Господом; сыны же Аароновы, священники, принесут кровь и покропят кровью со всех сторон на жертвенник, который у входа скинии собрания;"},{"verse":6,"text":"и снимет кожу с жертвы всесожжения и рассечет ее на части;"},{"verse":7,"text":"сыны же Аароновы, священники, положат на жертвенник огонь и на огне положат дрова;"},{"verse":8,"text":"и положат на дрова сии части, голову и тук;"},{"verse":9,"text":"внутренности же жертвы и ноги ее вымоет водою, и сожжет их священник на жертвеннике: это всесожжение, жертва, благоухание, приятное Господу."},{"verse":10,"text":"Если жертва всесожжения его из мелкого скота, из овец, или из коз, пусть принесет ее мужеского пола, без порока,"},{"verse":11,"text":"и заколет ее пред Господом на северной стороне жертвенника, и сыны Аароновы, священники, покропят кровью ее на жертвенник со всех сторон;"},{"verse":12,"text":"и рассекут ее на части, отделив голову ее и тук ее, и разложит их священник на дровах, которые на огне, на жертвеннике;"},{"verse":13,"text":"а внутренности и ноги вымоет водою, и принесет священник все и сожжет на жертвеннике: это всесожжение, жертва, благоухание, приятное Господу."},{"verse":14,"text":"Если же из птиц приносит он Господу всесожжение, то пусть принесет жертву свою из горлиц, или из молодых голубей;"},{"verse":15,"text":"священник принесет ее к жертвеннику, и свернет ей голову, и сожжет на жертвеннике, а кровь выцедит к стене жертвенника;"},{"verse":16,"text":"потом вынет зоб ее с перьями и бросит его подле жертвенника на восточную сторону, где пепел;"},{"verse":17,"text":"и рассечет ее в крыльях ее, не отделяя их, и сожжет ее священник на жертвеннике, на дровах, которые на огне: это всесожжение, жертва, благоухание, приятное Господу."}
                ]
            },
            {
                "title": "Числа",
                "chapters": [
                    [{"verse":1,"text":"И сказал Господь Моисею в пустыне Синайской, в скинии собрания, в первый [день] второго месяца, во второй год по выходе их из земли Египетской, говоря:"},{"verse":2,"text":"Исчислите все общество сынов Израилевых по родам их, по семействам их, по числу имен, всех мужеского пола поголовно:"},{"verse":3,"text":"от двадцати лет и выше, всех годных для войны у Израиля, по ополчениям их исчислите их — ты и Аарон;"},{"verse":4,"text":"с вами должны быть из каждого колена по одному человеку, который в роде своем есть главный."},{"verse":5,"text":"И вот имена мужей, которые будут с вами: от Рувима Елицур, сын Шедеура;"},{"verse":6,"text":"от Симеона Шелумиил, сын Цуришаддая;"},{"verse":7,"text":"от Иуды Наассон, сын Аминадава;"},{"verse":8,"text":"от Иссахара Нафанаил, сын Цуара;"},{"verse":9,"text":"от Завулона Елиав, сын Хелона;"},{"verse":10,"text":"от сынов Иосифа: от Ефрема Елишама, сын Аммиуда; от Манассии Гамалиил, сын Педацура;"},{"verse":11,"text":"от Вениамина Авидан, сын Гидеония;"},{"verse":12,"text":"от Дана Ахиезер, сын Аммишаддая;"},{"verse":13,"text":"от Асира Пагиил, сын Охрана;"},{"verse":14,"text":"от Гада Елиасаф, сын Регуила;"},{"verse":15,"text":"от Неффалима Ахира, сын Енана."},{"verse":16,"text":"Это — избранные мужи общества, начальники колен отцов своих, главы тысяч Израилевых."},{"verse":17,"text":"И взял Моисей и Аарон мужей сих, которые названы поименно,"},{"verse":18,"text":"и собрали они все общество в первый [день] второго месяца, и объявили родословные свои по родам их, по семействам их, по числу имен, от двадцати лет и выше, поголовно,"},{"verse":19,"text":"как повелел Господь Моисею. И сделал он исчисление в пустыне Синайской."},{"verse":20,"text":"И было сынов Рувима, первенца Израилева, по родам их, по семействам их, по их родам, по числу имен, поголовно, всех мужеского пола, от двадцати лет и выше, всех годных для войны,"},{"verse":21,"text":"исчислено в колене Рувимовом сорок шесть тысяч пятьсот."},{"verse":22,"text":"Сынов Симеона по родам их, по семействам их, по родам их, исчислено их по числу имен, поголовно, всех мужеского пола, от двадцати лет и выше, всех годных для войны,"},{"verse":23,"text":"исчислено в колене Симеоновом пятьдесят девять тысяч триста."},{"verse":24,"text":"Сынов Гада по родам их, по семействам их, по числу имен, от двадцати лет и выше, всех годных для войны,"},{"verse":25,"text":"исчислено в колене Гадовом сорок пять тысяч шестьсот пятьдесят."},{"verse":26,"text":"Сынов Иуды по родам их, по семействам их, по числу имен, от двадцати лет и выше, всех годных для войны,"},{"verse":27,"text":"исчислено в колене Иудином семьдесят четыре тысячи шестьсот."},{"verse":28,"text":"Сынов Иссахара по родам их, по семействам их, по числу имен, от двадцати лет и выше, всех годных для войны,"},{"verse":29,"text":"исчислено в колене Иссахаровом пятьдесят четыре тысячи четыреста."},{"verse":30,"text":"Сынов Завулона по родам их, по семействам их, по числу имен, от двадцати лет и выше, всех годных для войны,"},{"verse":31,"text":"исчислено в колене Завулоновом пятьдесят семь тысяч четыреста."},{"verse":32,"text":"Сынов Иосифа: сынов Ефрема по родам их, по семействам их, по числу имен, от двадцати лет и выше, всех годных для войны,"},{"verse":33,"text":"исчислено в колене Ефремовом сорок тысяч пятьсот."},{"verse":34,"text":"Сынов Манассии по родам их, по семействам их, по числу имен, от двадцати лет и выше, всех годных для войны,"},{"verse":35,"text":"исчислено в колене Манассиином тридцать две тысячи двести."},{"verse":36,"text":"Сынов Вениамина по родам их, по семействам их, по числу имен, от двадцати лет и выше, всех годных для войны,"},{"verse":37,"text":"исчислено в колене Вениаминовом тридцать пять тысяч четыреста."},{"verse":38,"text":"Сынов Дана по родам их, по семействам их, по числу имен, от двадцати лет и выше, всех годных для войны,"},{"verse":39,"text":"исчислено в колене Дановом шестьдесят две тысячи семьсот."},{"verse":40,"text":"Сынов Асира по родам их, по семействам их, по числу имен, от двадцати лет и выше, всех годных для войны,"},{"verse":41,"text":"исчислено в колене Асировом сорок одна тысяча пятьсот."},{"verse":42,"text":"Сынов Неффалима по родам их, по семействам их, по числу имен, от двадцати лет и выше, всех годных для войны,"},{"verse":43,"text":"исчислено в колене Неффалимовом пятьдесят три тысячи четыреста."},{"verse":44,"text":"Вот вошедшие в исчисление, которых исчислил Моисей и Аарон и начальники Израиля — двенадцать человек, по одному человеку от каждого колена."},{"verse":45,"text":"И было всех, вошедших в исчисление, сынов Израилевых, по семействам их, от двадцати лет и выше, всех годных для войны у Израиля,"},{"verse":46,"text":"и было всех вошедших в исчисление шестьсот три тысячи пятьсот пятьдесят."},{"verse":47,"text":"А левиты по колену отцов их не были исчислены между ними."},{"verse":48,"text":"И сказал Господь Моисею, говоря:"},{"verse":49,"text":"только колена Левиина не вноси в исчисление и не считай их вместе с сынами Израиля;"},{"verse":50,"text":"но поручи левитам скинию откровения и все принадлежности ее и все, что при ней; пусть они носят скинию и все принадлежности ее, и служат при ней, и около скинии пусть ставят стан свой;"},{"verse":51,"text":"и когда надобно переносить скинию, пусть поднимают ее левиты, и когда надобно остановиться скинии, пусть ставят ее левиты; а если приступит кто посторонний, предан будет смерти."},{"verse":52,"text":"Сыны Израилевы должны ставить стан свой каждый в стане своем и каждый при своем знамени, по ополчениям своим;"},{"verse":53,"text":"а левиты должны ставить стан свой около скинии откровения, чтобы не было гнева на общество сынов Израилевых, и будут левиты стоять на страже у скинии откровения."},{"verse":54,"text":"И сделали сыны Израилевы все, что повелел Господь Моисею; так сделали."}
                ]
            },
            {
                "title": "Второзаконие",
                "chapters": [
                    [{"verse":1,"text":"Сии суть слова, которые говорил Моисей всем Израильтянам за Иорданом в пустыне, на равнине против Суфа, между Фараном и Тофелом, и Лаваном, и Асирофом, и Дизагавом."},{"verse":2,"text":"Одиннадцать дней пути от Хорива, по дороге от горы Сеир до Кадес-Варни."},{"verse":3,"text":"В сороковом году, в одиннадцатом месяце, в первый день месяца, говорил Моисей сынам Израилевым все, что заповедал ему Господь о них."},{"verse":4,"text":"По убиении им Сигона, царя Аморрейского, который жил в Есевоне, и Ога, царя Васанского, который жил в Аштарофе в Едреи,"},{"verse":5,"text":"за Иорданом, в земле Моавитской, начал Моисей изъяснять закон сей и сказал:"},{"verse":6,"text":"Господь, Бог наш, говорил нам на Хориве и сказал: полно вам жить на горе сей;"},{"verse":7,"text":"обратитесь и отправьтесь в путь, и пойдите на гору Аморрейскую и ко всем соседям их, на равнину, на гору, на низкие места, на юг и на берег моря, в землю Ханаанскую и к Ливану, до реки великой, реки Евфрата."},{"verse":8,"text":"Вот, Я даю вам землю сию, пойдите, возьмите в наследие землю, которую Господь с клятвою обещал отцам вашим, Аврааму, Исааку и Иакову, дать им и потомству их после них."},{"verse":9,"text":"И сказал я вам в то время: не могу один водить вас;"},{"verse":10,"text":"Господь, Бог ваш, умножил вас, и вот вы ныне многочисленны, как звезды небесные;"},{"verse":11,"text":"Господь, Бог отцов ваших, да умножит вас в тысячу крат против того, сколько вас есть, и да благословит вас, как Он говорил вам;"},{"verse":12,"text":"как же мне одному носить тягости ваши, бремена ваши и распри ваши?"},{"verse":13,"text":"выберите себе по коленам вашим мужей мудрых, разумных и испытанных, и я поставлю их начальниками вашими."},{"verse":14,"text":"Вы отвечали мне и сказали: хорошее дело велишь ты сделать."},{"verse":15,"text":"И взял я главных колен ваших, мужей мудрых и испытанных, и поставил их начальниками над вами: тысяченачальниками, стоначальниками, пятидесятиначальниками, десятиначальниками и надзирателями по коленам вашим."},{"verse":16,"text":"И дал я повеление судьям вашим в то время, говоря: выслушивайте братьев ваших и судите справедливо, как брата с братом, так и пришельца его;"},{"verse":17,"text":"не различайте лиц на суде, как малого, так и великого выслушивайте: не бойтесь лица человеческого, ибо суд — дело Божиe; а дело, которое для вас трудно, доводите до меня, и я выслушаю его."},{"verse":18,"text":"И дал я вам в то время повеления о всем, что надлежит вам делать."},{"verse":19,"text":"И отправились мы от Хорива и шли по всей этой великой и страшной пустыне, которую вы видели, по дороге к горе Аморрейской, как повелел нам Господь, Бог наш, и пришли в Кадес-Варни."},{"verse":20,"text":"И сказал я вам: вы пришли к горе Аморрейской, которую Господь, Бог наш, дает нам."},{"verse":21,"text":"Вот, Господь, Бог твой, отдает тебе землю сию; иди, возьми ее в наследие, как говорил тебе Господь, Бог отцов твоих; не бойся и не страшись."},{"verse":22,"text":"Но вы все подошли ко мне и сказали: пошлем пред собою людей, чтобы они высмотрели нам землю и принесли нам известие о дороге, по которой идти, и о городах, в которые идти."},{"verse":23,"text":"Слово это мне показалось хорошим, и я взял из вас двенадцать человек, по одному человеку от колена."},{"verse":24,"text":"Они отправились, взошли на гору и дошли до долины Есхол, и высмотрели ее;"},{"verse":25,"text":"и взяли в руки свои плодов земли и принесли нам, и принесли нам известие и сказали: хороша земля, которую Господь, Бог наш, дает нам."},{"verse":26,"text":"Но вы не захотели идти и воспротивились повелению Господа, Бога вашего;"},{"verse":27,"text":"и роптали в шатрах ваших и говорили: по ненависти к нам Господь вывел нас из земли Египетской, чтобы предать нас в руки Аморреев и истребить нас."},{"verse":28,"text":"Куда мы пойдем? Братья наши расслабили сердце наше, говоря: народ тот более и выше нас; города там огромные и укрепленные до небес, а также и сыны Енаковы видели мы там."},{"verse":29,"text":"И я сказал вам: не страшитесь и не бойтесь их;"},{"verse":30,"text":"Господь, Бог ваш, идет пред вами; Он будет сражаться за вас, как Он сделал с вами в Египте пред глазами вашими,"},{"verse":31,"text":"и в пустыне, где ты видел, что Господь, Бог твой, нес тебя, как человек несет сына своего, на всем пути, которым вы шли, доколе не пришли на место сие."},{"verse":32,"text":"Но и после сего вы не верили Господу, Богу вашему,"},{"verse":33,"text":"Который шел пред вами по пути, чтобы высмотреть вам место, где остановиться вам, ночью в огне, чтобы показывать вам дорогу, по которой идти, а днем в облаке."},{"verse":34,"text":"И услышал Господь слова ваши и, разгневавшись, поклялся, говоря:"},{"verse":35,"text":"никто из людей сих, от сего злого рода, не увидит доброй земли, которую Я клятвенно обещал дать отцам вашим;"},{"verse":36,"text":"кроме Халева, сына Иефонниина; он увидит ее, и ему дам Я землю, по которой он ходил, и сынам его, за то, что он повиновался Господу."},{"verse":37,"text":"И на меня прогневался Господь за вас, говоря: и ты не войдешь туда;"},{"verse":38,"text":"Иисус, сын Навин, который предстоит пред тобою, он войдет туда; его утверди, ибо он введет Израиля в наследие земли;"},{"verse":39,"text":"дети ваши, о которых вы говорили, что они достанутся в добычу врагам, и сыновья ваши, которые не знают ныне ни добра, ни зла, они войдут туда, и им дам ее, и они овладеют ею;"},{"verse":40,"text":"а вы обратитесь и отправьтесь в пустыню по дороге к Чермному морю."},{"verse":41,"text":"Тогда вы отвечали и сказали мне: согрешили мы пред Господом, мы пойдем и сразимся, как повелел нам Господь, Бог наш. И препоясались каждый своим оружием, и безрассудно решились идти на вершину горы."},{"verse":42,"text":"Но Господь сказал мне: скажи им: не ходите и не сражайтесь, потому что нет меня среди вас; чтобы не поразили вас враги ваши."},{"verse":43,"text":"Я говорил вам, но вы не послушали и воспротивились повелению Господа, и по упорству своему взошли на гору."},{"verse":44,"text":"И выступили против вас Аморреи, жившие на горе той, и преследовали вас, как делают пчелы, и поражали вас на Сеире, до самой Хормы."},{"verse":45,"text":"И возвратились вы и плакали пред Господом; но Господь не услышал голоса вашего и не внял вам."},{"verse":46,"text":"И пробыли вы в Кадесе много времени, сколько времени вы пробыли."}
                ]
            }
        ];

        function loadBooks() {
            bookSelect.innerHTML = '';
            bibleData.forEach(book => {
                const option = document.createElement('option');
                option.value = book.title;
                option.textContent = book.title;
                bookSelect.appendChild(option);
            });
            if (bibleData.length > 0) {
                updateMaxChapter();
                loadChapter(bibleData[0].title, 1);
            }
        }

        function updateMaxChapter() {
            const selectedBook = bookSelect.options[bookSelect.selectedIndex]?.value;
            const book = bibleData.find(b => b.title === selectedBook);
            if (book) {
                chapterInput.max = book.chapters.length;
                if (parseInt(chapterInput.value) > book.chapters.length) {
                    chapterInput.value = 1;
                }
            }
        }

        function loadChapter(bookName, chapterNumber) {
            const book = bibleData.find(b => b.title === bookName);
            if (!book) {
                contentDiv.innerHTML = '<p>Книга не найдена</p>';
                return;
            }

            const chapterIndex = chapterNumber - 1;
            if (chapterIndex < 0 || chapterIndex >= book.chapters.length) {
                contentDiv.innerHTML = '<p>Глава не найдена</p>';
                return;
            }

            const chapter = book.chapters[chapterIndex];
            let html = '<h2>' + book.title + ', глава ' + chapterNumber + '</h2>';
            
            chapter.forEach(function(verse) {
                html += '<div class="verse"><span class="verse-number">' + verse.verse + '</span><span>' + verse.text + '</span></div>';
            });
            
            contentDiv.innerHTML = html;
            
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        bookSelect.addEventListener('change', function() {
            updateMaxChapter();
            const selectedBook = bookSelect.options[bookSelect.selectedIndex]?.value;
            loadChapter(selectedBook, 1);
            chapterInput.value = 1;
        });

        loadBtn.addEventListener('click', function() {
            const selectedBook = bookSelect.options[bookSelect.selectedIndex]?.value;
            const chapter = parseInt(chapterInput.value);
            if (selectedBook && !isNaN(chapter)) {
                loadChapter(selectedBook, chapter);
            }
        });

        chapterInput.addEventListener('change', function() {
            const selectedBook = bookSelect.options[bookSelect.selectedIndex]?.value;
            const chapter = parseInt(chapterInput.value);
            if (selectedBook && !isNaN(chapter)) {
                loadChapter(selectedBook, chapter);
            }
        });

        // Загружаем данные
        bibleData = bibleDataFull;
        contentDiv.innerHTML = '<div class="loading">Загрузка Библии...</div>';
        loadBooks();
    </script>
</body>
</html>
