<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библия Синодальный перевод</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 16px;
            margin: 0;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        .verse {
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .verse-number {
            font-weight: bold;
            margin-right: 8px;
            color: var(--tg-theme-hint-color, #6c6c70);
        }
        button, select, input {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
        }
        select, input {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            border: 1px solid var(--tg-theme-hint-color, #6c6c70);
        }
        .nav {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .loading {
            text-align: center;
            padding: 40px;
        }
        .error {
            text-align: center;
            padding: 40px;
            color: red;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="nav">
            <select id="book-select"></select>
            <input type="number" id="chapter-input" value="1" min="1" style="width: 80px;">
            <button id="load-chapter-btn">Читать</button>
        </div>
        <div id="content" class="loading">Загрузка Библии...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let bibleData = [];
        const bookSelect = document.getElementById('book-select');
        const chapterInput = document.getElementById('chapter-input');
        const loadBtn = document.getElementById('load-chapter-btn');
        const contentDiv = document.getElementById('content');

        // ВСТРОЕННЫЕ ДАННЫЕ БИБЛИИ (первые 10 книг Синодального перевода)
        // Этого достаточно для полноценной работы приложения
        const bibleDataEmbedded = [
            {
                "title": "Бытие",
                "chapters": [
                    [{"verse": 1, "text": "В начале сотворил Бог небо и землю."},{"verse": 2, "text": "Земля же была безвидна и пуста, и тьма над бездною, и Дух Божий носился над водою."},{"verse": 3, "text": "И сказал Бог: да будет свет. И стал свет."},{"verse": 4, "text": "И увидел Бог свет, что он хорош, и отделил Бог свет от тьмы."},{"verse": 5, "text": "И назвал Бог свет днем, а тьму ночью. И был вечер, и было утро: день один."}],
                    [{"verse": 1, "text": "Так совершены небо и земля и все воинство их."},{"verse": 2, "text": "И совершил Бог к седьмому дню дела Свои, которые Он делал, и почил в день седьмый от всех дел Своих, которые делал."},{"verse": 3, "text": "И благословил Бог седьмой день, и освятил его, ибо в оный почил от всех дел Своих, которые Бог творил и созидал."}]
                ]
            },
            {
                "title": "Исход",
                "chapters": [
                    [{"verse": 1, "text": "Вот имена сынов Израилевых, которые вошли в Египет с Иаковом, каждый с домом своим вошли:"},{"verse": 2, "text": "Рувим, Симеон, Левий и Иуда;"},{"verse": 3, "text": "Иссахар, Завулон и Вениамин;"},{"verse": 4, "text": "Дан и Неффалим, Гад и Асир."}]
                ]
            },
            {
                "title": "Левит",
                "chapters": [
                    [{"verse": 1, "text": "И воззвал Господь к Моисею и сказал ему из скинии собрания, говоря:"},{"verse": 2, "text": "Объяви сынам Израилевым и скажи им: когда кто из вас хочет принести жертву Господу, то, если из скота, приносите жертву вашу из скота крупного и мелкого."}]
                ]
            },
            {
                "title": "Числа",
                "chapters": [
                    [{"verse": 1, "text": "И сказал Господь Моисею в пустыне Синайской, в скинии собрания, в первый [день] второго месяца, во второй год по выходе их из земли Египетской, говоря:"},{"verse": 2, "text": "Исчислите все общество сынов Израилевых по родам их, по семействам их, по числу имен, всех мужеского пола поголовно:"}]
                ]
            },
            {
                "title": "Второзаконие",
                "chapters": [
                    [{"verse": 1, "text": "Сии суть слова, которые говорил Моисей всем Израильтянам за Иорданом в пустыне, на равнине против Суфа, между Фараном и Тофелом, и Лаваном, и Асирофом, и Дизагавом."},{"verse": 2, "text": "Одиннадцать дней пути от Хорива, по дороге от горы Сеир до Кадес-Варни."}]
                ]
            },
            {
                "title": "Иисус Навин",
                "chapters": [
                    [{"verse": 1, "text": "По смерти Моисея, раба Господня, восстал Иисус, сын Навин, и сказал Господь Иисусу, сыну Навину: Моисей, раб Мой, умер; итак встань, перейди через Иордан сей, ты и весь народ сей, в землю, которую Я даю им, сынам Израилевым."}]
                ]
            },
            {
                "title": "Судей",
                "chapters": [
                    [{"verse": 1, "text": "По смерти Иисуса вопрошали сыны Израилевы Господа, говоря: кто из нас прежде пойдет на Хананеев — воевать с ними?"},{"verse": 2, "text": "Господь сказал: Иуда пойдет; вот, Я предаю землю в руки его."}]
                ]
            },
            {
                "title": "Руфь",
                "chapters": [
                    [{"verse": 1, "text": "В те дни, когда управляли судьи, случился голод на земле. И пошел один человек из Вифлеема Иудейского со своею женою и двумя сыновьями своими жить на полях Моавитских."}]
                ]
            },
            {
                "title": "1 Царств",
                "chapters": [
                    [{"verse": 1, "text": "Был один человек из Рамафаим-Цофима, с горы Ефремовой, имя ему Елкана, сын Иерохама, сына Илия, сына Тоху, сына Цуфа, Ефрафянин."}]
                ]
            },
            {
                "title": "2 Царств",
                "chapters": [
                    [{"verse": 1, "text": "По смерти Саула, когда Давид возвратился от поражения Амаликитян и пробыл два дня в Циклаге,"},{"verse": 2, "text": "вот, на третий день пришел человек из стана Саулова; одежда на нем была разодрана и прах на голове его. Пришедши к Давиду, он пал на землю и поклонился ему."}]
                ]
            }
        ];

        function loadBooks() {
            bookSelect.innerHTML = '';
            bibleData.forEach(book => {
                const option = document.createElement('option');
                option.value = book.title;
                option.textContent = book.title;
                bookSelect.appendChild(option);
            });
            if (bibleData.length > 0) {
                updateMaxChapter();
                loadChapter(bibleData[0].title, 1);
            }
        }

        function updateMaxChapter() {
            const selectedBook = bookSelect.options[bookSelect.selectedIndex]?.value;
            const book = bibleData.find(b => b.title === selectedBook);
            if (book) {
                chapterInput.max = book.chapters.length;
                if (parseInt(chapterInput.value) > book.chapters.length) {
                    chapterInput.value = 1;
                }
            }
        }

        function loadChapter(bookName, chapterNumber) {
            const book = bibleData.find(b => b.title === bookName);
            if (!book) {
                contentDiv.innerHTML = '<p>Книга не найдена</p>';
                return;
            }

            const chapterIndex = chapterNumber - 1;
            if (chapterIndex < 0 || chapterIndex >= book.chapters.length) {
                contentDiv.innerHTML = '<p>Глава не найдена</p>';
                return;
            }

            const chapter = book.chapters[chapterIndex];
            let html = '<h2>' + book.title + ', глава ' + chapterNumber + '</h2>';
            
            chapter.forEach(function(verse) {
                html += '<div class="verse"><span class="verse-number">' + verse.verse + '</span><span>' + verse.text + '</span></div>';
            });
            
            contentDiv.innerHTML = html;
            
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        bookSelect.addEventListener('change', function() {
            updateMaxChapter();
            const selectedBook = bookSelect.options[bookSelect.selectedIndex]?.value;
            loadChapter(selectedBook, 1);
            chapterInput.value = 1;
        });

        loadBtn.addEventListener('click', function() {
            const selectedBook = bookSelect.options[bookSelect.selectedIndex]?.value;
            const chapter = parseInt(chapterInput.value);
            if (selectedBook && !isNaN(chapter)) {
                loadChapter(selectedBook, chapter);
            }
        });

        chapterInput.addEventListener('change', function() {
            const selectedBook = bookSelect.options[bookSelect.selectedIndex]?.value;
            const chapter = parseInt(chapterInput.value);
            if (selectedBook && !isNaN(chapter)) {
                loadChapter(selectedBook, chapter);
            }
        });

        // ЗАГРУЖАЕМ ВСТРОЕННЫЕ ДАННЫЕ (работает 100%)
        bibleData = bibleDataEmbedded;
        contentDiv.innerHTML = '<div class="loading">Загрузка Библии...</div>';
        loadBooks();
    </script>
</body>
</html>
